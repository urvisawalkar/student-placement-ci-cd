name: Student Placement ML CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: CI - Validate, Train and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dataset
        run: python validate_data.py

      - name: Train model (accuracy quality gate >= 80%)
        run: python train.py

      - name: Run automated tests
        run: pytest -v

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: placement-model
          path: |
            placement_model.pkl
            metrics.json

  cd:
    name: CD - Deploy Application
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: placement-model

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy and run prediction service
        run: |
          echo "Deploying Student Placement Prediction application..."
          python predict.py
          echo "Deployment successful"